name: rolling

on:
  pull_request:
    branches:
      - rolling
  push:
    branches:
      - rolling
      
jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
      fail-fast: false
    steps:
      - name: Repo checkout
        uses: actions/checkout@v2
      - name: Setup ROS 2
        uses: ros-tooling/setup-ros@0.7.9
        with:
          required-ros-distributions: rolling
      - name: build and test
        uses: ros-tooling/action-ros-ci@0.3.15
        with:
          package-name: tiago_harmonic
          target-ros2-distro: rolling
          vcs-repo-file-url: ${GITHUB_WORKSPACE}/dependencies.repos
          skip-test: true
          colcon-defaults: |
            {
              "build": {
                "packages-up-to": true
              }
            }